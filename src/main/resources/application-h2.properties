server.port=8080

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:learnloop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Use schema.sql to create tables (avoids Hibernate DDL ordering issues with H2)
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.jpa.show-sql=true

# Enable H2 Web Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Ensure SQL init runs before JPA
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# AI Service Connection
ai.service.url=http://localhost:8000
